[project]
name = "linux64studio"
version = "0.1.0"
description = "A GTK4 C64 development IDE for Linux, compatible with CBM prg Studio's assembler syntax"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["py65>=1.2"]   # the 6502 of Debug Without VICE (emu.sim)

[project.scripts]
l64asm = "l64s.asm.cli:main"
l64bas = "l64s.basic.cli:main"
l64disk = "l64s.disk.cli:main"
l64cart = "l64s.cart.cli:main"
l64sid = "l64s.sid.cli:main"
l64bin = "l64s.bincli:main"
l64test = "l64s.transcript:main"
linux64studio = "l64s.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/l64s"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
