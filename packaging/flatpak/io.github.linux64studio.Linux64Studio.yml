# The Linux64Studio Flatpak. Build it with tools/build-flatpak.sh (which needs flatpak-builder and
# the GNOME 51 SDK: see the script).
#
# VICE, cc65, Java (Kick Assembler), GoatTracker, git and RetroDebugger aren't in the Flatpak:
# Linux64Studio runs the host's own with flatpak-spawn --host (l64s/host.py), so they're installed
# as usual, outside it.
app-id: io.github.linux64studio.Linux64Studio
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: linux64studio
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # VICE's binary monitor, on localhost
  - --share=network
  # projects, and ~/.config/linux64studio and ~/.local/share/linux64studio shared with a normal install
  - --filesystem=home
  # the host's /usr, read-only at /run/host/usr: VICE's character ROM, cc65's headers
  - --filesystem=host-os:ro
  # running VICE, cc65, Java, GoatTracker, git and the rest on the host
  - --talk-name=org.freedesktop.Flatpak
modules:
  # py65, the 6502 that Debug Without VICE runs (l64s/emu/sim.py): its wheel unpacked into
  # site-packages (pure Python; the runtime has no pip)
  - name: python3-py65
    buildsystem: simple
    build-commands:
      - >-
        python3 -m zipfile -e py65-1.2.0-py2.py3-none-any.whl
        "$(python3 -c "import sysconfig; print(sysconfig.get_path('purelib', vars={'base': '/app'}))")"
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/f6/3d/7171f8401bb3cf058d233af314d3e314a348488bd22b2143b3591566a172/py65-1.2.0-py2.py3-none-any.whl
        sha256: 8e51f149647f2c2b44e5eb54350057771ccaef97f5f3d593fa3737e44c1ce4b7
  - name: linux64studio
    buildsystem: simple
    build-commands:
      - sh packaging/flatpak/install.sh /app
    sources:
      - type: dir
        path: ../..
        skip:
          - .venv
          - .git
          - .flatpak-builder
          - flatpak-build
          - flatpak-repo
          - tests
          - build
          - .ruff_cache
